services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_DOCUMENTS_BUCKET: ${VITE_SUPABASE_DOCUMENTS_BUCKET:-element-documents}
        VITE_N8N_ELEMENTS_ASSETS_URL: ${VITE_N8N_ELEMENTS_ASSETS_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "8080:80"
    restart: unless-stopped
